
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
body {
  background: #020b18;
  color: #00eaff;
  font-family: Arial;
  text-align: center;
  padding-top: 70px;
}
h1 {
  letter-spacing: 8px;
  text-shadow: 0 0 15px cyan;
}
.circle {
  width: 190px;
  height: 190px;
  border: 4px solid #00eaff;
  border-radius: 50%;
  margin: 45px auto;
  box-shadow: 0 0 30px cyan;
  display: grid;
  place-items: center;
  font-size: 45px;
}
button {
  background: transparent;
  color: cyan;
  border: 2px solid cyan;
  padding: 15px 30px;
  border-radius: 30px;
  font-size: 18px;
}
</style>
</head>
<body>
<h1>J.A.R.V.I.S</h1>
<p>PERSONAL AI ASSISTANT</p>
<div class="circle">◉</div>
<p id="status">SYSTEM ONLINE</p>
<button onclick="speak()">START JARVIS</button>
<br><br>
<button onclick="listen()">🎙️ SPEAK TO JARVIS</button>
<p id="heard">Waiting for your voice...</p><script>
function speak() {
  document.getElementById("status").innerText =
  "HELLO ADARSH";
  let msg = new SpeechSynthesisUtterance(
    "Hello Adarsh. I am Jarvis. How can I help you?"
  );
  msg.lang = "en-IN";
  speechSynthesis.speak(msg);
}
function listen() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice recognition is not supported in this browser.");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.continuous = false;

  document.getElementById("heard").innerText = "Listening...";

  recognition.onresult = function(event) {
    let text = event.results[0][0].transcript;
    document.getElementById("heard").innerText = "You said: " + text;

    let reply = new SpeechSynthesisUtterance("You said " + text);
    reply.lang = "hi-IN";
    speechSynthesis.speak(reply);
  };

  recognition.onerror = function(event) {
  document.getElementById("heard").innerText =
    "Error: " + event.error;
};

  recognition.start();
}</script>
</body>
</html>
